name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune --depth=1 origin "$GITHUB_REF"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Run complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(printf '%s\n' "${RUNNER_TOOL_CACHE}"/node/22.*/x64 | sort -V | tail -n 1)"
          if [ ! -x "${node_bin}/bin/node" ]; then
            echo "Node.js 22 was not found in the runner tool cache." >&2
            exit 1
          fi
          export PATH="${node_bin}/bin:${PATH}"
          node --version
          npm --version
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run bundle
          npm run verify:reproducible-build
          node --check main.js
          npm run validate:versions
          npm run validate:repository
          npm run stage:release
          npm run validate:release-assets
          npm run smoke:clean-vault
