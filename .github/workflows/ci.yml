name: CI

on:
  push:
    branches:
      - agent/ci-validation-base
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    if: ${{ !contains(github.event.head_commit.message, '[ci-result]') }}
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete repository suite
        id: suite
        shell: bash
        run: |
          set +e
          npm run ci 2>&1 | tee /tmp/semantic-links-ci.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record validation result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.suite.outputs.exit_code || '1' }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "exit_code=${EXIT_CODE}"
            echo "runner=${RUNNER_NAME}"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "last_log_lines:"
            tail -n 120 /tmp/semantic-links-ci.log 2>/dev/null || true
          } > docs/.ci-validation-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.ci-validation-result
          git commit -m "[ci-result] Record consolidated validation" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail when validation failed
        if: ${{ steps.suite.outputs.exit_code != '0' }}
        run: exit 1
