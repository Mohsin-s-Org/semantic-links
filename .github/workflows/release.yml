name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete verification pipeline
        run: npm run ci

      - name: Read and verify release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          test "${GITHUB_REF_NAME}" = "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/manifest.json

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/styles.css

      - name: Publish exact Community Plugins assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            dist/release/main.js \
            dist/release/manifest.json \
            dist/release/styles.css \
            --title "Semantic Links ${VERSION}" \
            --generate-notes \
            --verify-tag
