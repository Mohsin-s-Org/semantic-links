name: Temporary consolidated validation

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-consolidated-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Check for an existing result
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/Mohsin-s-Org/semantic-links/issues/39/comments?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          done = any("[temporary-ci-result]" in comment.get("body", "") for comment in comments)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"done={'true' if done else 'false'}\n")
          PY

      - name: Check out consolidated branch
        if: steps.guard.outputs.done != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/consolidated-semantic-efficiency
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.guard.outputs.done != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.guard.outputs.done != 'true'
        run: npm ci

      - name: Run complete repository suite
        if: steps.guard.outputs.done != 'true'
        id: suite
        shell: bash
        run: |
          set +e
          npm run ci 2>&1 | tee /tmp/semantic-links-ci.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post result to PR 39
        if: steps.guard.outputs.done != 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.suite.outputs.exit_code || '1' }}
          TESTED_SHA: a44a9069f507884b03727cff94ff8127337bfcdb
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          log_path = pathlib.Path("/tmp/semantic-links-ci.log")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines() if log_path.exists() else []
          tail = "\n".join(lines[-80:])
          passed = os.environ["EXIT_CODE"] == "0"
          body = (
              "[temporary-ci-result]\n\n"
              f"Self-hosted full suite: **{'PASS' if passed else 'FAIL'}**\n\n"
              f"Tested implementation head: `{os.environ['TESTED_SHA']}`\n"
              f"Runner: `{os.environ.get('RUNNER_NAME', 'self-hosted')}`\n"
              f"Exit code: `{os.environ['EXIT_CODE']}`\n\n"
              "The workflow ran `npm run ci`, covering strict typecheck, lint, unit/integration tests, "
              "production bundle, reproducibility, generated syntax, version/repository policy, "
              "release staging/allowlist and clean-vault smoke. No artifacts were uploaded.\n\n"
              "<details><summary>Last log lines</summary>\n\n```text\n"
              f"{tail}\n```\n</details>"
          )
          payload = json.dumps({"body": body}).encode()
          request = urllib.request.Request(
              "https://api.github.com/repos/Mohsin-s-Org/semantic-links/issues/39/comments",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request):
              pass
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          git rm --ignore-unmatch .github/workflows/temporary-consolidated-validation.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary consolidated validation workflow [skip ci]"
          git push origin HEAD:main

      - name: Fail when the suite failed
        if: steps.guard.outputs.done != 'true' && steps.suite.outputs.exit_code != '0'
        run: exit 1
